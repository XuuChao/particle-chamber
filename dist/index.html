<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d12">
    <meta name="description" content="Draw a silhouette and watch it become a floating sculpture of light.">
    <title>Particle Chamber — Draw something into being</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23c7e5ed'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
    </script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="experience" id="experience">
      <div class="stage" id="stage">
        <canvas id="scene" tabindex="0" aria-label="Interactive particle sculpture. Move to stir it, drag or use the arrow keys to look around the cabinet."></canvas>
      </div>
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="Particle Chamber home"><span class="brand-icon" aria-hidden="true">✳</span><span>PARTICLE<br>CHAMBER</span></a>
      </header>
      <aside class="drawing-entry" aria-label="Create your own shape">
        <button class="draw-button" id="draw-open" type="button" aria-expanded="false" aria-controls="drawing-panel" disabled>
          <span class="draw-button-label">Draw a shape</span><span class="draw-button-arrow" aria-hidden="true">↗</span>
        </button>
      </aside>
      <section class="drawing-panel" id="drawing-panel" aria-labelledby="drawing-title" hidden>
        <div class="panel-heading">
          <div><p class="eyebrow">YOUR TURN</p><h2 id="drawing-title">Give it a shape.</h2></div>
          <button class="icon-button" id="draw-close" type="button" aria-label="Close drawing panel">×</button>
        </div>
        <p class="panel-intro">Draw one outline. We’ll close it and add volume.</p>
        <div class="drawing-surface">
          <canvas id="drawing" aria-label="Drawing pad. Draw a single outline using your mouse or finger."></canvas>
          <span class="drawing-placeholder" id="drawing-placeholder">A heart? A leaf? Something new.</span>
        </div>
        <p class="drawing-feedback" id="drawing-feedback" role="status">Your drawing stays on this device.</p>
        <div class="drawing-actions">
          <button class="text-button" id="draw-clear" type="button">Clear</button>
          <button class="solid-button" id="draw-generate" type="button">Make particles <span aria-hidden="true">↗</span></button>
        </div>
      </section>
      <div class="load-state" id="load-state" role="status">
        <span class="loading-mark" aria-hidden="true">✳</span><h2 id="load-title">Lighting the chamber…</h2><p id="load-message">Just a moment.</p>
        <button class="solid-button" id="reload" type="button" hidden>Reload</button>
      </div>
      <footer class="controls">
        <div class="control-buttons">
          <button class="control-button" id="pause" type="button" aria-pressed="false" disabled><span id="pause-icon" aria-hidden="true">Ⅱ</span> <span id="pause-label">Pause</span></button>
          <button class="control-button" id="reset" type="button" disabled><span aria-hidden="true">↺</span> Reset</button>
        </div>
        <p class="gesture-hint"><span class="hint-desktop">Move to stir <i>·</i> Let it settle <i>·</i> Drag to rotate</span><span class="hint-touch">Drag to rotate <i>·</i> Draw a shape</span></p>
        <p class="status" id="status" role="status"><span class="status-dot" aria-hidden="true"></span><span id="status-text">Starting</span></p>
      </footer>
      <noscript><div class="noscript">Please enable JavaScript to explore the particle chamber.</div></noscript>
    </main>
  </body>
</html>
